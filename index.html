<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Thrift Facts — Resale Appraiser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#15130d;
    --muted:#6b6558;
    --line:#e6e1d6;
    --bg:#efece4;
    --resell:#2f6b3a;
    --keep:#3b5b92;
    --pass:#c1401c;
    --money:#9a6f06;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 40px rgba(0,0,0,0.06);padding:28px 20px 60px;}
  header{text-align:center;margin-bottom:18px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
  h1{font-family:'Archivo Black',sans-serif;font-size:30px;letter-spacing:-0.01em;margin:0;line-height:1;}
  .subhead{font-size:13px;color:var(--muted);margin-top:8px;}

  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;cursor:pointer;border-radius:2px;padding:12px 16px;transition:transform .05s ease, opacity .15s ease;}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.45;cursor:default;}
  .btn-primary{background:var(--ink);color:var(--paper);flex:1;}
  .btn-secondary{background:var(--paper);color:var(--ink);border:2px solid var(--ink);flex:1;}
  .btn-danger{background:var(--paper);color:var(--pass);border:2px solid var(--pass);flex:1;}
  .btn-full{width:100%;}
  .btn-row{display:flex;gap:10px;width:100%;}
  input[type=file]{display:none;}

  .status-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);text-align:center;margin:10px 0 2px;min-height:16px;}
  .status-line.err{color:var(--pass);}
  .config-warning{font-family:'IBM Plex Mono',monospace;font-size:11px;background:#fff6ea;border:1px solid var(--money);color:#5c4108;padding:10px 12px;border-radius:2px;margin-bottom:18px;line-height:1.5;}

  /* Auth */
  .auth-card{border:3px solid var(--ink);padding:18px;}
  .auth-card h2{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  .field{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
  .field input,.field select{display:block;width:100%;margin-top:4px;font-family:'Inter',sans-serif;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);border:none;border-bottom:1.5px solid var(--line);padding:6px 0;background:transparent;}
  .field input:focus{outline:none;border-bottom-color:var(--ink);}

  .session-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .session-row select{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;text-transform:uppercase;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:2px;padding:5px 8px;}
  .link-btn{background:none;border:none;padding:0;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-decoration:underline;}

  /* Tabs */
  .tabs{display:flex;border-bottom:3px solid var(--ink);margin-bottom:20px;}
  .tab-btn{flex:1;background:var(--paper);border:none;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);padding:10px 0;border-bottom:3px solid transparent;margin-bottom:-3px;}
  .tab-btn.active{color:var(--ink);border-bottom:3px solid var(--ink);}

  /* Capture */
  .capture-box{border:3px solid var(--ink);border-radius:2px;padding:16px;margin-bottom:14px;}
  .capture-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 6px;text-align:center;}
  .capture-empty p{margin:0;color:var(--muted);font-size:13px;max-width:280px;}
  .preview-wrap{position:relative;}
  .preview-wrap img{width:100%;display:block;border-radius:2px;max-height:320px;object-fit:cover;}
  .retake{position:absolute;top:8px;right:8px;background:rgba(21,19,13,0.75);color:#fff;font-size:11px;font-family:'IBM Plex Mono',monospace;padding:6px 10px;border-radius:2px;letter-spacing:0.05em;cursor:pointer;}
  textarea{width:100%;font-family:'Inter',sans-serif;font-size:14px;border:1.5px solid var(--ink);border-radius:2px;padding:10px;resize:vertical;color:var(--ink);}
  textarea:focus{outline:none;}
  .inline-fields{display:flex;gap:14px;margin:12px 0 4px;}
  .inline-fields .field{flex:1;margin-bottom:6px;}

  /* Result panel */
  .facts{border:4px solid var(--ink);padding:12px 14px 16px;margin-top:20px;}
  .item-title{font-family:'Archivo Black',sans-serif;font-size:24px;line-height:1.1;border:none;width:100%;padding:0;background:transparent;color:var(--ink);}
  .item-title:focus{outline:none;}
  .item-sub{font-size:12px;color:var(--muted);margin:4px 0 10px;}
  .verdict{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:10px 12px;border-radius:2px;}
  .verdict.resell{background:var(--resell);}
  .verdict.keep{background:var(--keep);}
  .verdict.pass{background:var(--pass);}
  .verdict-label{font-family:'Archivo Black',sans-serif;font-size:20px;letter-spacing:0.01em;text-transform:uppercase;}
  .verdict-conf{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.9;}
  .reasoning{font-size:13px;line-height:1.45;margin:10px 0 4px;}
  .reasoning.small{font-size:12px;color:var(--muted);}
  .rule-thick{border-top:8px solid var(--ink);margin:8px 0 6px;}
  .rule-med{border-top:4px solid var(--ink);margin:8px 0;}
  .rule-thin{border-top:1px solid var(--line);margin:10px 0;}
  .price-row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);gap:10px;}
  .price-row .pl{font-size:13px;font-weight:600;}
  .price-row .pv{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;text-align:right;white-space:nowrap;}
  .price-row.big .pl{font-family:'Archivo Black',sans-serif;font-size:16px;font-weight:400;}
  .price-row.big .pv{font-size:22px;font-weight:700;}
  .money{color:var(--money);}
  .pos{color:var(--resell);}
  .neg{color:var(--pass);}
  .fine{font-weight:400;font-size:10px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-left:4px;}
  .price-note{font-size:11px;color:var(--muted);font-style:italic;padding:4px 0 2px;}
  .price-row input{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;border:none;border-bottom:1.5px dashed var(--muted);background:transparent;width:72px;text-align:right;color:var(--ink);}
  .desc{font-size:13px;line-height:1.45;margin:6px 0;}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;}
  .plat-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .plat-row span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--muted);}
  ul.checks{margin:0;padding-left:18px;font-size:13px;line-height:1.5;}
  .sources a{display:block;font-size:12px;color:var(--keep);padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ungrounded{font-size:11px;color:var(--pass);font-style:italic;}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:7px 10px;border:1.5px solid var(--ink);border-radius:2px;background:var(--paper);color:var(--ink);cursor:pointer;font-weight:600;}
  .pill.active{background:var(--ink);color:var(--paper);}

  /* Log */
  .stat-strip{display:flex;border:3px solid var(--ink);margin-bottom:16px;}
  .stat{flex:1;text-align:center;padding:10px 4px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .sv{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;display:block;}
  .stat .sl{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
  .log-card{border-bottom:1px solid var(--line);}
  .log-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:none;padding:11px 0;text-align:left;font-weight:400;}
  .log-head .name{font-weight:600;font-size:14px;}
  .meta{color:var(--muted);font-size:11px;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .log-head .right{text-align:right;flex:none;}
  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:#fff;padding:3px 7px;border-radius:2px;}
  .badge.resell{background:var(--resell);}
  .badge.keep{background:var(--keep);}
  .badge.pass{background:var(--pass);}
  .log-body{padding:0 0 14px;}
  .log-photo{width:100%;max-height:260px;object-fit:cover;border-radius:2px;display:block;margin-bottom:8px;background:var(--line);min-height:120px;}
  .edit-grid{display:flex;gap:14px;margin:12px 0 8px;}
  .edit-grid .field{flex:1;margin-bottom:4px;}
  .empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">Estimated Resale Value</div>
    <h1>THRIFT FACTS</h1>
    <div class="subhead">Snap it. Price it. Decide before the checkout line.</div>
  </header>

  <div id="configWarning"></div>

  <!-- Sign-in gate -->
  <div id="authGate" style="display:none;">
    <div class="auth-card">
      <h2>Sign in</h2>
      <label class="field">Email<input type="email" id="authEmail" autocomplete="username" /></label>
      <label class="field">Password<input type="password" id="authPassword" autocomplete="current-password" /></label>
      <button class="btn-primary btn-full" id="signInBtn">Sign in</button>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <div class="session-row">
      <span>Logging as
        <select id="userSelect">
          <option value="Nick">Nick</option>
          <option value="Ashleigh">Ashleigh</option>
        </select>
      </span>
      <button class="link-btn" id="signOutBtn">Sign out</button>
    </div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab-btn active" data-tab="scan">Scan</button>
      <button type="button" class="tab-btn" data-tab="log">Log</button>
    </div>

    <!-- Scan tab -->
    <div id="scanTab">
      <div class="capture-box">
        <div class="capture-empty" id="captureEmpty">
          <p>Photograph the item. Include labels, maker's marks or model numbers if you can.</p>
          <div class="btn-row">
            <button class="btn-secondary" id="cameraBtn">Take Photo</button>
            <button class="btn-secondary" id="uploadBtn">Upload</button>
          </div>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" />
          <input type="file" id="uploadInput" accept="image/*" />
        </div>
        <div class="preview-wrap" id="previewWrap" style="display:none;">
          <img id="previewImg" alt="Item preview" />
          <div class="retake" id="retakeBtn">RETAKE</div>
        </div>
      </div>

      <textarea id="descriptionInput" rows="2" placeholder="Optional details: what the label says, size, flaws, e.g. 'Pendleton wool shirt, size L, small moth hole on cuff'"></textarea>

      <div class="inline-fields">
        <label class="field">Tag price $<input type="number" id="askingInput" inputmode="decimal" step="0.01" placeholder="e.g. 7.99" /></label>
        <label class="field">Store<input type="text" id="storeInput" placeholder="optional" /></label>
      </div>

      <button class="btn-primary btn-full" id="appraiseBtn">Appraise</button>
      <div class="status-line" id="statusLine"></div>
      <div id="resultPanel"></div>
    </div>

    <!-- Log tab -->
    <div id="logTab" style="display:none;">
      <div class="stat-strip">
        <div class="stat"><span class="sv" id="stLogged">0</span><span class="sl">Logged</span></div>
        <div class="stat"><span class="sv" id="stBought">0</span><span class="sl">Bought</span></div>
        <div class="stat"><span class="sv" id="stSpent">$0</span><span class="sl">Spent</span></div>
        <div class="stat"><span class="sv" id="stProfit">$0</span><span class="sl">Realized</span></div>
      </div>
      <div id="logList"><div class="empty">Nothing logged yet.</div></div>
    </div>
  </div>
</div>

<script>
/* ====================== CONFIGURE THIS ======================
   Paste the project URL and anon/publishable key of the Supabase
   project that holds the thrift_items table (see SETUP.md).
   The anon key is safe to publish ONLY because every table and
   the photo bucket require a signed-in user (RLS).
================================================================ */
const SUPABASE_URL = "https://gffmnecxfdxtcamaknki.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vcGx4iWWfMWoHqM-S6E8Iw_VC_Ib2yp";
/* ============================================================== */

const PHOTO_BUCKET = "thrift-photos";
const FN_NAME = "appraise-item";
const FEE_RATE = 0.15;          // rough blended platform fee for the profit estimate
const USERS = ["Nick", "Ashleigh"];
const VERDICTS = {
  buy_resell: { label: "Buy & Resell", short: "Resell", cls: "resell" },
  buy_keep:   { label: "Buy & Keep",   short: "Keep",   cls: "keep" },
  pass:       { label: "Pass",         short: "Pass",   cls: "pass" },
};
const DECISIONS = {
  bought_resell: "Bought to resell",
  bought_keep: "Bought to keep",
  passed: "Passed",
};

const el = (id) => document.getElementById(id);
const isConfigured = !SUPABASE_URL.includes("YOUR_") && !SUPABASE_ANON_KEY.includes("YOUR_");
let supabaseClient = null;
if (isConfigured) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  el("configWarning").innerHTML =
    '<div class="config-warning">⚠ Supabase isn\'t configured. Set SUPABASE_URL and SUPABASE_ANON_KEY at the top of the &lt;script&gt; tag.</div>';
}

const state = {
  session: null,
  currentUser: "Nick",
  activeTab: "scan",
  aiBase64: null, mediaType: null,  // 1024px JPEG sent to Gemini
  thumbBlob: null,                   // 800px JPEG stored in Supabase Storage
  result: null, sources: [], grounded: false,
  asking: null, store: "", decision: null,
  rows: [], logLoaded: false,
};

const statusLine = el("statusLine");
function setStatus(msg, isErr = false){
  statusLine.textContent = msg || "";
  statusLine.classList.toggle("err", !!isErr);
}

/* ---------------- Helpers ---------------- */
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function numOrNull(v){
  if (v === null || v === undefined || v === "") return null;
  const n = Number(String(v).replace(/[$,]/g, ""));
  return isFinite(n) ? n : null;
}
function money(v){
  const n = numOrNull(v);
  if (n === null) return "—";
  const abs = Math.abs(n);
  const s = abs.toLocaleString(undefined, { minimumFractionDigits: abs < 100 && abs % 1 ? 2 : 0, maximumFractionDigits: abs < 100 ? 2 : 0 });
  return (n < 0 ? "−$" : "$") + s;
}
function range(lo, hi){
  const a = numOrNull(lo), b = numOrNull(hi);
  if (a === null && b === null) return "—";
  if (a === null || b === null || a === b) return money(a ?? b);
  return `${money(a)}–${money(b)}`;
}
function confLabel(c){
  return ({ high: "High confidence", medium: "Medium confidence", low: "Low confidence" })[c] || "";
}
function computeProfit(resaleLow, asking){
  const lo = numOrNull(resaleLow), ask = numOrNull(asking);
  if (lo === null || ask === null) return null;
  return lo * (1 - FEE_RATE) - ask;
}

/* ---------------- Auth ---------------- */
function applySession(session){
  state.session = session;
  el("authGate").style.display = session ? "none" : "block";
  el("mainApp").style.display = session ? "block" : "none";
  // Defer data calls out of the auth callback (supabase-js can deadlock otherwise).
  if (session && state.activeTab === "log") setTimeout(loadLog, 0);
}

if (supabaseClient) {
  supabaseClient.auth.onAuthStateChange((_event, session) => applySession(session));
}

el("signInBtn").addEventListener("click", async () => {
  const email = el("authEmail").value.trim();
  const password = el("authPassword").value;
  if (!email || !password) return;
  el("signInBtn").disabled = true;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  el("signInBtn").disabled = false;
  if (error) alert("Sign-in failed: " + error.message);
});
el("authPassword").addEventListener("keydown", (e) => { if (e.key === "Enter") el("signInBtn").click(); });
el("signOutBtn").addEventListener("click", () => supabaseClient.auth.signOut());

/* ---------------- User + tabs ---------------- */
function resolveInitialUser(){
  const fromUrl = new URLSearchParams(location.search).get("user");
  const match = fromUrl && USERS.find(u => u.toLowerCase() === fromUrl.toLowerCase());
  if (match) return match;
  try { const s = localStorage.getItem("thriftFactsUser"); if (USERS.includes(s)) return s; } catch (e) {}
  return USERS[0];
}
state.currentUser = resolveInitialUser();
el("userSelect").value = state.currentUser;
el("userSelect").addEventListener("change", (e) => {
  state.currentUser = e.target.value;
  try { localStorage.setItem("thriftFactsUser", state.currentUser); } catch (err) {}
  state.logLoaded = false;
  if (state.activeTab === "log") loadLog();
});

el("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  state.activeTab = btn.dataset.tab;
  el("tabs").querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
  el("scanTab").style.display = state.activeTab === "scan" ? "block" : "none";
  el("logTab").style.display = state.activeTab === "log" ? "block" : "none";
  if (state.activeTab === "log") loadLog();
});

/* ---------------- Photo capture ---------------- */
el("cameraBtn").addEventListener("click", () => el("cameraInput").click());
el("uploadBtn").addEventListener("click", () => el("uploadInput").click());
el("cameraInput").addEventListener("change", (e) => handleFile(e.target.files[0]));
el("uploadInput").addEventListener("change", (e) => handleFile(e.target.files[0]));
el("retakeBtn").addEventListener("click", clearPhoto);

function loadImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Couldn't decode that image.")); };
    img.src = url;
  });
}
function renderScaled(img, maxEdge){
  const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const canvasToBlob = (c, q) => new Promise(r => c.toBlob(r, "image/jpeg", q));

async function handleFile(file){
  if (!file) return;
  setStatus("Preparing photo…");
  try {
    const { img, url } = await loadImage(file);
    // Bigger copy for the model (labels need detail), smaller copy for storage.
    const aiDataUrl = renderScaled(img, 1024).toDataURL("image/jpeg", 0.8);
    state.aiBase64 = aiDataUrl.split(",")[1];
    state.mediaType = "image/jpeg";
    state.thumbBlob = await canvasToBlob(renderScaled(img, 800), 0.7);
    URL.revokeObjectURL(url);
    el("previewImg").src = aiDataUrl;
    el("captureEmpty").style.display = "none";
    el("previewWrap").style.display = "block";
    setStatus("");
    console.log(`AI image ~${Math.round(state.aiBase64.length * 0.75 / 1024)} KB, stored thumb ~${Math.round(state.thumbBlob.size / 1024)} KB`);
  } catch (err) {
    console.error(err);
    setStatus(err.message || "Couldn't process that photo.", true);
  }
}

function clearPhoto(){
  state.aiBase64 = null; state.mediaType = null; state.thumbBlob = null;
  el("captureEmpty").style.display = "flex";
  el("previewWrap").style.display = "none";
  el("cameraInput").value = ""; el("uploadInput").value = "";
}

function resetScan(){
  clearPhoto();
  state.result = null; state.sources = []; state.decision = null; state.asking = null;
  el("descriptionInput").value = "";
  el("askingInput").value = "";
  el("resultPanel").innerHTML = "";
}

/* ---------------- Edge function calls ---------------- */
// Grounded (web-searching) calls are slower than plain vision calls.
const INVOKE_TIMEOUT_MS = 95000; // server stops starting new model attempts at ~80s
const RETRYABLE_STATUSES = [429, 502, 503, 546];
const RETRY_DELAYS_MS = [1500, 4000];

function isRetryable(err){
  const msg = String(err && err.message || err);
  return RETRYABLE_STATUSES.some(s => msg.includes(String(s))) || /WORKER_RESOURCE_LIMIT/i.test(msg);
}

async function invokeOnce(name, body){
  const result = await Promise.race([
    supabaseClient.functions.invoke(name, { body }),
    new Promise((_, reject) => setTimeout(() => reject(new Error("Request timed out — check your signal and try again.")), INVOKE_TIMEOUT_MS)),
  ]);
  if (result.error) {
    let detail = result.error.message || String(result.error);
    const ctx = result.error.context;
    if (ctx && typeof ctx.json === "function") {
      try {
        const parsed = await (ctx.clone ? ctx.clone() : ctx).json();
        detail = `${ctx.status || ""} ${parsed.error || parsed.message || detail}`.trim();
      } catch (e) {}
    }
    throw new Error(detail);
  }
  if (result.data && result.data.error) throw new Error(result.data.error);
  return result.data;
}

async function invokeFn(name, body, attempt = 0){
  try {
    return await invokeOnce(name, body);
  } catch (err) {
    if (attempt < RETRY_DELAYS_MS.length && isRetryable(err)) {
      setStatus(`Temporary hiccup — retrying… (${attempt + 1}/${RETRY_DELAYS_MS.length})`);
      await new Promise(r => setTimeout(r, RETRY_DELAYS_MS[attempt]));
      return invokeFn(name, body, attempt + 1);
    }
    throw err;
  }
}

/* ---------------- Appraise ---------------- */
el("appraiseBtn").addEventListener("click", appraise);

async function appraise(){
  const description = el("descriptionInput").value.trim();
  if (!state.aiBase64 && !description) { setStatus("Add a photo, a description, or both.", true); return; }
  if (!supabaseClient) { setStatus("Supabase isn't configured.", true); return; }

  const asking = numOrNull(el("askingInput").value);
  el("appraiseBtn").disabled = true;
  el("resultPanel").innerHTML = "";
  setStatus("Identifying and checking recent prices… (20–40s)");

  try {
    const body = { description: description || null, asking_price: asking };
    if (state.aiBase64) { body.image_base64 = state.aiBase64; body.media_type = state.mediaType; }
    const data = await invokeFn(FN_NAME, body);
    state.result = data.estimate || {};
    state.sources = data.sources || [];
    state.grounded = !!data.grounded;
    state.model = data.model || null;
    if (data.attempts && data.attempts.length) console.warn("Fallbacks before success:", data.attempts);
    state.asking = asking;
    state.store = el("storeInput").value.trim();
    state.decision = null;
    renderResult();
    const via = state.model ? ` (${state.model})` : "";
    setStatus(state.grounded ? `Appraisal ready${via}.` : `Appraisal ready${via} — no live price search on this one.`);
  } catch (err) {
    console.error(err);
    const msg = String(err && err.message || err);
    if (msg.includes("429") || /rate|quota/i.test(msg)) setStatus("Gemini rate limit hit — wait a minute and try again.", true);
    else if (/401|JWT|auth/i.test(msg)) setStatus("Session expired — sign out and back in.", true);
    else setStatus("Couldn't appraise that one: " + msg, true);
  } finally {
    el("appraiseBtn").disabled = false;
  }
}

function renderResult(){
  const r = state.result;
  const v = VERDICTS[r.recommendation] || VERDICTS.pass;
  const np = r.new_price || {};
  const rs = r.resale || {};
  const platforms = Array.isArray(rs.platforms) ? rs.platforms : [];
  const checks = Array.isArray(r.what_to_check) ? r.what_to_check : [];

  el("resultPanel").innerHTML = `
    <div class="facts">
      <input class="item-title" id="rName" value="${esc(r.item_name || "Unknown item")}" />
      <div class="item-sub">${esc([r.category, r.brand].filter(Boolean).join(" · "))}</div>

      <div class="verdict ${v.cls}">
        <span class="verdict-label">${v.label}</span>
        <span class="verdict-conf">${esc(confLabel(r.identification_confidence))}</span>
      </div>
      <p class="reasoning">${esc(r.reasoning || "")}</p>

      <div class="rule-thick"></div>
      <div class="price-row"><span class="pl">Tag price</span><span class="pv">$<input id="rAsking" type="number" inputmode="decimal" step="0.01" value="${state.asking ?? ""}" placeholder="—" /></span></div>
      <div class="price-row"><span class="pl">New retail</span><span class="pv">${range(np.low, np.high)}</span></div>
      ${np.note ? `<div class="price-note">${esc(np.note)}</div>` : ""}
      <div class="price-row big"><span class="pl">Resale</span><span class="pv money">${range(rs.low, rs.high)}</span></div>
      ${rs.note ? `<div class="price-note">${esc(rs.note)}</div>` : ""}
      <div class="price-row"><span class="pl">Max buy price</span><span class="pv">${money(r.max_buy_price)}</span></div>
      <div class="price-row"><span class="pl">Est. profit<span class="fine">low end, −15% fees</span></span><span class="pv" id="rProfit">—</span></div>
      <div class="price-row"><span class="pl">Demand</span><span class="pv">${esc(rs.demand || "—")}</span></div>

      <div class="rule-med"></div>
      <div class="desc">${esc(r.description || "")}</div>

      ${platforms.length ? `
        <div class="section-label">By platform</div>
        ${platforms.map(p => `<div class="plat-row"><span>${esc(p.name)}</span><span>${range(p.low, p.high)}</span></div>`).join("")}
      ` : ""}

      ${checks.length ? `
        <div class="section-label">Check before buying</div>
        <ul class="checks">${checks.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      ` : ""}

      <div class="section-label">Sources</div>
      ${state.grounded && state.sources.length
        ? `<div class="sources">${state.sources.map(s => `<a href="${esc(s.uri)}" target="_blank" rel="noopener">${esc(s.title || s.uri)}</a>`).join("")}</div>`
        : `<div class="ungrounded">No live price search ran for this appraisal — treat values as the model's estimate.</div>`}

      <div class="rule-thin"></div>
      <div class="section-label">What did you do? (optional, editable later)</div>
      <div class="pill-row" id="decisionSelect">
        ${Object.entries(DECISIONS).map(([k, label]) => `<button type="button" class="pill" data-decision="${k}">${label}</button>`).join("")}
      </div>
      <button class="btn-primary btn-full" id="saveBtn">Save to Log</button>
    </div>
  `;

  updateProfit();
  el("rAsking").addEventListener("input", () => { state.asking = numOrNull(el("rAsking").value); updateProfit(); });
  el("decisionSelect").addEventListener("click", (e) => {
    const b = e.target.closest(".pill"); if (!b) return;
    state.decision = state.decision === b.dataset.decision ? null : b.dataset.decision;
    el("decisionSelect").querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.dataset.decision === state.decision));
  });
  el("saveBtn").addEventListener("click", saveItem);
}

function updateProfit(){
  const p = computeProfit(state.result?.resale?.low, state.asking);
  const out = el("rProfit");
  if (!out) return;
  out.textContent = p === null ? "—" : money(p);
  out.className = "pv " + (p === null ? "" : p >= 0 ? "pos" : "neg");
}

/* ---------------- Save ---------------- */
async function saveItem(){
  const r = state.result;
  if (!r) return;
  el("saveBtn").disabled = true;
  setStatus("Saving…");

  let photo_path = null;
  if (state.thumbBlob) {
    const path = `${state.currentUser.toLowerCase()}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error: upErr } = await supabaseClient.storage.from(PHOTO_BUCKET)
      .upload(path, state.thumbBlob, { contentType: "image/jpeg", upsert: false });
    if (upErr) console.error("Photo upload failed:", upErr);
    else photo_path = path;
  }

  const row = {
    user_name: state.currentUser,
    item_name: el("rName").value.trim() || r.item_name || "Unknown item",
    category: r.category || null,
    brand: r.brand || null,
    description: r.description || null,
    store: state.store || null,
    asking_price: state.asking,
    new_price_low: numOrNull(r.new_price?.low),
    new_price_high: numOrNull(r.new_price?.high),
    resale_low: numOrNull(r.resale?.low),
    resale_high: numOrNull(r.resale?.high),
    max_buy_price: numOrNull(r.max_buy_price),
    recommendation: VERDICTS[r.recommendation] ? r.recommendation : null,
    decision: state.decision,
    photo_path,
    analysis: { ...r, sources: state.sources, grounded: state.grounded, model: state.model },
  };

  const { error } = await supabaseClient.from("thrift_items").insert([row]);
  if (error) {
    console.error(error);
    if (photo_path) await supabaseClient.storage.from(PHOTO_BUCKET).remove([photo_path]);
    setStatus("Save failed: " + error.message, true);
    el("saveBtn").disabled = false;
    return;
  }
  resetScan();
  setStatus(photo_path || !state.thumbBlob ? "Saved." : "Saved (photo upload failed — details only).");
  state.logLoaded = false;
}

/* ---------------- Log ---------------- */
async function loadLog(){
  if (!supabaseClient || !state.session) return;
  const { data, error } = await supabaseClient
    .from("thrift_items")
    .select("*")
    .eq("user_name", state.currentUser)
    .order("created_at", { ascending: false })
    .limit(200);
  if (error) { console.error(error); el("logList").innerHTML = `<div class="empty">Couldn't load: ${esc(error.message)}</div>`; return; }
  state.rows = data || [];
  state.logLoaded = true;
  renderStats();
  renderLog();
}

function renderStats(){
  const rows = state.rows;
  const bought = rows.filter(r => r.decision === "bought_keep" || r.decision === "bought_resell");
  const spent = bought.reduce((s, r) => s + (numOrNull(r.asking_price) || 0), 0);
  const sold = rows.filter(r => numOrNull(r.sold_price) !== null);
  const realized = sold.reduce((s, r) => s + numOrNull(r.sold_price) - (numOrNull(r.asking_price) || 0), 0);
  el("stLogged").textContent = rows.length;
  el("stBought").textContent = bought.length;
  el("stSpent").textContent = money(spent);
  el("stProfit").textContent = money(realized);
}

function renderLog(){
  if (!state.rows.length) { el("logList").innerHTML = '<div class="empty">Nothing logged yet.</div>'; return; }
  el("logList").innerHTML = state.rows.map(row => {
    const v = VERDICTS[row.recommendation];
    const when = new Date(row.created_at).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const meta = [when, row.store, row.asking_price != null ? `${money(row.asking_price)} tag` : null, row.decision ? DECISIONS[row.decision] : null].filter(Boolean).join(" · ");
    return `
      <div class="log-card" data-id="${row.id}">
        <button type="button" class="log-head" data-action="toggle">
          <div>
            <div class="name">${esc(row.item_name)}</div>
            <div class="meta">${esc(meta)}</div>
          </div>
          <div class="right">
            ${v ? `<span class="badge ${v.cls}">${v.short}</span>` : ""}
            <div class="meta">${range(row.resale_low, row.resale_high)}</div>
          </div>
        </button>
        <div class="log-body" style="display:none;"></div>
      </div>`;
  }).join("");
}

function logBodyHtml(row){
  const a = row.analysis || {};
  return `
    ${row.photo_path ? `<img class="log-photo" alt="${esc(row.item_name)}" />` : ""}
    <div class="desc">${esc(row.description || "")}</div>
    ${a.reasoning ? `<p class="reasoning small">${esc(a.reasoning)}</p>` : ""}
    <div class="price-row"><span class="pl">New retail</span><span class="pv">${range(row.new_price_low, row.new_price_high)}</span></div>
    <div class="price-row"><span class="pl">Resale</span><span class="pv money">${range(row.resale_low, row.resale_high)}</span></div>
    <div class="price-row"><span class="pl">Max buy price</span><span class="pv">${money(row.max_buy_price)}</span></div>
    <div class="edit-grid">
      <label class="field">Decision
        <select data-field="decision">
          <option value="">—</option>
          ${Object.entries(DECISIONS).map(([k, l]) => `<option value="${k}"${row.decision === k ? " selected" : ""}>${l}</option>`).join("")}
        </select>
      </label>
      <label class="field">Sold for $<input type="number" inputmode="decimal" step="0.01" data-field="sold_price" value="${row.sold_price ?? ""}" /></label>
    </div>
    <div class="btn-row">
      <button type="button" class="btn-secondary" data-action="update">Update</button>
      <button type="button" class="btn-danger" data-action="delete">Delete</button>
    </div>`;
}

el("logList").addEventListener("click", async (e) => {
  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  const card = actionEl.closest(".log-card");
  const row = state.rows.find(r => String(r.id) === card.dataset.id);
  if (!row) return;
  const body = card.querySelector(".log-body");

  if (actionEl.dataset.action === "toggle") {
    const opening = body.style.display === "none";
    body.style.display = opening ? "block" : "none";
    if (opening && !body.dataset.rendered) {
      body.innerHTML = logBodyHtml(row);
      body.dataset.rendered = "1";
      // Photos are private; fetch a short-lived signed URL only when opened.
      if (row.photo_path) {
        const { data, error } = await supabaseClient.storage.from(PHOTO_BUCKET).createSignedUrl(row.photo_path, 3600);
        const img = body.querySelector(".log-photo");
        if (!error && data && img) img.src = data.signedUrl;
        else if (img) img.remove();
      }
    }
  }

  if (actionEl.dataset.action === "update") {
    actionEl.disabled = true;
    const decision = body.querySelector('[data-field="decision"]').value || null;
    const sold_price = numOrNull(body.querySelector('[data-field="sold_price"]').value);
    const { error } = await supabaseClient.from("thrift_items").update({ decision, sold_price }).eq("id", row.id);
    actionEl.disabled = false;
    if (error) { alert("Update failed: " + error.message); return; }
    await loadLog();
  }

  if (actionEl.dataset.action === "delete") {
    if (!confirm(`Delete "${row.item_name}"?`)) return;
    actionEl.disabled = true;
    const { error } = await supabaseClient.from("thrift_items").delete().eq("id", row.id);
    if (error) { alert("Delete failed: " + error.message); actionEl.disabled = false; return; }
    if (row.photo_path) await supabaseClient.storage.from(PHOTO_BUCKET).remove([row.photo_path]);
    await loadLog();
  }
});
</script>
